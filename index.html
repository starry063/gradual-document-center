function editor(){const n=node(selected);if(!n)return '<section class="card empty">'+icon('folder')+'<h3>Your documentation starts here</h3><p>Create a group, then add your first document.</p></section>';if(n.kind==='group')return groupEditor(n);const c=edit,readonly=role==='organizer';return `<section class="card"><div class="editor-head between"><div><div class="flex"><h2 id="editor-title">${esc(c.title)}</h2>${statusLabel(current())}${readonly?'<span class="badge">Read only</span>':''}</div><div class="status" id="save-state">${icon(dirty?'edit':'check')}${dirty?'Unsaved changes':saveState||'All changes saved'}</div></div><div class="popover-wrap">${btn(icon('more'),'menu','iconbtn','aria-label="Document actions"')}${menu?`<div class="menu">${btn(icon('move')+'Move to…','move')}${btn(icon('up')+'Move up','reorder-up')}${btn(icon('down')+'Move down','reorder-down')}${btn(icon('folder')+'Display locations','locations')}${btn(icon('trash')+'Remove from center','remove','red')}${btn(icon('eye')+'Unpublish','unpublish','red',!c.published||readonly?'disabled':'')}</div>`:''}</div></div><div class="meta"><div class="source-line flex">${icon('layers')}<span>Source:</span><strong>${esc(c.source)}</strong><span>·</span><span>${esc(parentPath(n.parent))}</span>${btn('View in content library '+icon('external'),'nav:resources','link')}</div><div class="metadata"><div><label>Applies to</label>${btn(`<span>${esc(modelsText(c))||'Select products'}</span>${icon('down')}`,'models','multi-button',readonly?'disabled':'')}</div><div><label for="doc-type">Document type</label><select id="doc-type" ${readonly?'disabled':''}>${opts(types,c.type)}</select></div><div><label for="doc-access">Who can view</label><select id="doc-access" ${readonly?'disabled':''}>${opts(accessOptions,c.access)}</select></div></div></div><div class="editor-body"><label class="visually-hidden" for="doc-title">Document title</label><input id="doc-title" class="titleinput" value="${esc(c.title)}" placeholder="Untitled document" ${readonly?'readonly':''}><label class="visually-hidden" for="doc-summary">Summary</label><textarea rows="1" id="doc-summary" class="summaryinput" placeholder="Add a short summary…" ${readonly?'readonly':''}>${esc(c.summary)}</textarea><div class="toolbar" role="toolbar" aria-label="Text formatting">${btn('H2','format:heading','',readonly?'disabled aria-label="Heading"':'aria-label="Heading"')}${btn('<b>B</b>','format:bold','',readonly?'disabled aria-label="Bold"':'aria-label="Bold"')}${btn('<i>I</i>','format:italic','',readonly?'disabled aria-label="Italic"':'aria-label="Italic"')}<span class="sep"></span>${btn(icon('list'),'format:list','',readonly?'disabled aria-label="Bullet list"':'aria-label="Bullet list"')}${btn(icon('link'),'format:link','',readonly?'disabled aria-label="Insert link"':'aria-label="Insert link"')}${btn(icon('image'),'insert-image','',readonly?'disabled aria-label="Insert demo image"':'aria-label="Insert demo image"')}<span style="margin-left:auto;font-size:10px;color:#a1a8a3">${readonly?'Read only':'Rich text'}</span></div><div id="doc-body" class="richtext ${readonly?'readonly':''}" contenteditable="${!readonly}" role="textbox" aria-label="Document body" aria-multiline="true" spellcheck="false">${c.body}</div></div>${readonly?`<div class="editing-notice notice">${icon('lock')}<span>You can organize this document, but you don’t have permission to edit or publish it.</span></div>`:''}${c.uses.length?`<div class="sharing notice amber">${icon('info')}<div>This article is also used in <strong>${esc(c.uses.join(', '))}</strong>.<br><span>Publishing updates the same content in every location.</span></div></div>`:`<div class="sharing between"><span class="flex" style="font-size:10px;color:#909a93">${icon('book')}Used in Document Center only</span>${btn('Manage locations','locations','link')}</div>`}<div class="editor-foot between"><span>${c.published?'Readers see the last published version until you publish.':'Drafts are visible only to authorized editors.'}</span>${btn(icon('save')+'Save draft','save','',!dirty||readonly?'disabled':'')}</div></section>`}
function groupEditor(n){const list=children(n.id);return `<section class="card"><div class="editor-head between"><h2>Group settings</h2><span class="badge">Level ${depthOf(n.id)} of 3</span></div><div class="groupbody"><div class="folder-hero">${icon('folder')}</div><div class="field"><label for="group-name">Group name</label><input id="group-name" value="${esc(n.name)}"></div><div class="info-row">Location &nbsp; <strong>${esc(n.parent?parentPath(n.parent):'Document Center')}</strong></div><div class="flex">${btn(icon('move')+'Move to','move')}${btn('Save changes','save-group','primary')}</div><div class="groupchildren">${list.length?list.map(x=>btn(icon(x.kind==='group'?'folder':'file')+esc(nodeTitle(x))+(x.kind==='doc'?statusLabel(content(x.content)):`<span class="badge">Group</span>`),'select:'+x.id)).join(''):'<div class="empty">This group is empty. Add your first document below.</div>'}</div><div class="flex">${btn(icon('plus')+'New document','new','',role!=='admin'?'disabled':'')}${btn(icon('link')+'Add existing','add')}</div><div class="divider"></div>${btn(icon('trash')+'Remove group','remove-group','link','style="color:var(--red)"')}<p class="hint">Removing a group does not delete the original content.</p></div></section>`}
function settings(){const s=settingsDraft||data.settings;return `<div class="settings-grid"><div><section class="card settings-card"><h2>General</h2><p class="muted">Make your documentation easy to find and clearly named.</p><div class="setting-row"><label for="settings-name">Document Center name</label><input id="settings-name" data-setting="name" value="${esc(s.name)}" ${role!=='admin'?'disabled':''}></div><div class="setting-row"><label for="settings-navigation">Community navigation label</label><input id="settings-navigation" data-setting="navigation" value="${esc(s.navigation)}" ${role!=='admin'?'disabled':''}></div><div class="setting-row"><label>Show in community navigation</label><div class="flex">${btn('<span></span>','toggle-visible','switch '+(s.visible?'on':''),`aria-label="Show in community navigation" aria-pressed="${s.visible}" ${role!=='admin'?'disabled':''}`)}<span style="font-size:12px">${s.visible?'On':'Off'}</span></div></div><div class="setting-row"><label for="settings-access">Default audience</label><select id="settings-access" data-setting="access" ${role!=='admin'?'disabled':''}>${opts(accessOptions,s.access)}</select></div><div class="notice">${icon('shield')}<span>A document’s own access restrictions still apply. Making the center public does not make restricted articles public.</span></div></section><section class="card settings-card"><div class="between"><div><h2>Products & models</h2><p class="hint">Maintain names here. Editors choose from this list.</p></div>${btn(icon('plus')+'Add model','add-model','',role!=='admin'?'disabled':'')}</div><div class="flex" style="margin:20px 0">${[...new Set(data.models.map(m=>m.category))].map(c=>`<span class="category-chip">${esc(c)}</span>`).join('')}</div><div class="tablewrap"><table class="table"><thead><tr><th>Category</th><th>Product / model</th><th>Status</th><th></th></tr></thead><tbody>${data.models.map(m=>`<tr><td>${esc(m.category)}</td><td>${esc(m.name)}</td><td><span class="badge green">Active</span></td><td>${btn(icon('edit'),'edit-model:'+m.id,'iconbtn',`aria-label="Edit ${esc(m.name)}" ${role!=='admin'?'disabled':''}`)}</td></tr>`).join('')}</tbody></table></div><label class="checkline" style="margin-top:22px"><input type="checkbox" id="auto-model" ${s.autoModel?'checked':''} ${role!=='admin'?'disabled':''}>Select automatically when only one product is available</label><p class="hint">Categories help filter products. They do not add a directory level.</p></section></div><aside class="settings-aside">${icon('layers')}<h3>One structure. One source.</h3><p>Document Center organizes existing content into a single, maintainable directory.</p><p>Articles stay in Blogs and Resources. Editing them here updates the original content.</p><div class="divider"></div><p>All Collections keeps an index that opens this same workspace.</p>${btn('View All Collections '+icon('arrow'),'nav:allcollections','link')}</aside></div>`}
function library(){const entries=data.contents.filter(c=>c.source==='Resources'||c.source==='Blog').filter(c=>c.title.toLowerCase().includes(libraryQuery.toLowerCase()));return `<section class="card list-card"><div class="between"><div class="searchbox">${icon('search')}<input id="library-search" value="${esc(libraryQuery)}" placeholder="Search your content library…" aria-label="Search content library"></div><span class="badge">${entries.length} items</span></div><div class="notice" style="margin-bottom:19px">${icon('info')}<span>This prototype includes Resources and Blog articles used by Document Center. Each row represents one original article.</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Title</th><th>Source</th><th>Status</th><th>Used in</th><th>Action</th></tr></thead><tbody>${entries.map(c=>`<tr><td><div class="name">${icon('file')}<div>${esc(c.title)}<small>${esc(modelsText(c))}</small></div></div></td><td><span class="badge">${esc(c.source)}</span></td><td>${statusLabel(c)}</td><td>${allUses(c).map(u=>`<span class="badge" style="margin:2px">${esc(u)}</span>`).join('')||'<span class="muted">Not placed</span>'}</td><td>${linked(c.id)?btn('Open in Document Center '+icon('arrow'),'locate:'+c.id,'link'):btn('Add to Document Center','library-add:'+c.id,'link')}</td></tr>`).join('')}</tbody></table></div>${!entries.length?'<div class="empty">No matching content. Try a different title.</div>':''}<p class="list-note">${icon('layers')}Content storage and display locations are separate. Document-only articles do not appear in the community feed.</p></section>`}
function collections(){const all=view==='allcollections';return `<section class="card list-card"><div class="between"><h2>${all?'All collections':'Content collections'}</h2><span class="badge">${all?'3':'2'} collections</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Name</th><th>Used in</th><th>Manage</th></tr></thead><tbody>${all?`<tr style="background:#f0f8f3"><td><div class="name">${icon('book')}<div>Document Center<small>Managed in Document Center</small></div></div></td><td>Document Center</td><td>${btn('Open Document Center '+icon('arrow'),'nav:documents','link')}</td></tr>`:''}<tr><td><div class="name">${icon('folder')}Product & Engineering</div></td><td>Content</td><td><span class="muted">Outside this prototype</span></td></tr><tr><td><div class="name">${icon('folder')}Customer onboarding</div></td><td>Content</td><td>${btn('View shared content','shared-location','link')}</td></tr></tbody></table></div><p class="list-note">${icon('info')}${all?'Document Center opens its dedicated workspace. There is no second directory to maintain.':'Product documentation is managed in Document Center. Ordinary collections keep their own purpose.'}</p>${!all?btn('Open Document Center '+icon('arrow'),'nav:documents','link','style="margin-top:12px"'):''}</section>`}
function render(){document.title=`${view==='resources'?'Resources':'Document Center'} · Gradual prototype`;$('#app').innerHTML=sidebar()+`<div class="shell"><header class="topbar"><div class="community-label">${icon('grid')}<span>Gradual’s Test</span><span style="color:#d0d6d1">/</span><span>Dashboard</span></div><div class="topright">${btn(icon('external')+'Community site','community','',current()?'':'disabled')}<span>UTC −08:00</span>${btn(icon('help'),'help','iconbtn','aria-label="Prototype guide"')}${btn(icon('settings'),'demo','iconbtn','aria-label="Demo controls"')}<div class="avatar" title="Demo administrator">QZ</div></div></header><main class="main">${heading()}${view==='documents'?`<div class="workspace">${treePanel()}${editor()}</div>`:view==='settings'?settings():view==='resources'?library():collections()}</main></div>`;bindInputs();bindDrag()}
function bindInputs(){const on=(q,e,fn)=>$(q)?.addEventListener(e,fn);on('#tree-search','input',e=>{treeQuery=e.target.value;$('#tree-content').innerHTML=treeRows()||'<div class="empty">No matching documents.</div>';bindDrag()});on('#category-filter','change',e=>{category=e.target.value;$('#tree-content').innerHTML=treeRows()||'<div class="empty">No documents in this category.<br>Try All categories.</div>';bindDrag()});on('#doc-title','input',e=>{edit.title=e.target.value;markDirty()});on('#doc-summary','input',e=>{edit.summary=e.target.value;markDirty()});on('#doc-body','input',e=>{edit.body=e.target.innerHTML;markDirty()});on('#doc-body','paste',e=>{e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));edit.body=e.currentTarget.innerHTML;markDirty()});on('#doc-type','change',e=>{edit.type=e.target.value;markDirty()});on('#doc-access','change',e=>{edit.access=e.target.value;markDirty()});$$('[data-setting]').forEach(el=>el.addEventListener('input',e=>{settingsDraft[e.target.dataset.setting]=e.target.value;settingsDirty=true}));on('#auto-model','change',e=>{settingsDraft.autoModel=e.target.checked;settingsDirty=true});on('#library-search','input',e=>{const pos=e.target.selectionStart;libraryQuery=e.target.value;render();$('#library-search').focus();$('#library-search').setSelectionRange(pos,pos)});$$('.toolbar button').forEach(b=>b.addEventListener('mousedown',e=>e.preventDefault()))}
function depthOf(id){let d=0,n=node(id);while(n){d++;n=node(n.parent)}return d}
function subtreeHeight(id){return 1+Math.max(0,...children(id).map(n=>subtreeHeight(n.id)))}
function validateMove(id,parent){let p=parent;while(p){if(p===id)return 'A group cannot be moved into itself or one of its own subgroups.';p=node(p)?.parent}if(depthOf(parent)+subtreeHeight(id)>3)return 'This move would create a fourth level. Choose a higher-level group, or use headings inside the document.';if(node(id)?.kind==='doc'&&!parent)return 'Choose a group for this document.';return ''}
function bindDrag(){$$('[data-node]').forEach(el=>{el.addEventListener('dragstart',e=>{dragId=el.dataset.node;e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move'});el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over')});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain')||dragId,t=node(el.dataset.node);if(!node(id)||id===t.id)return;navigate(()=>{selected=id;loadEdit();const dest=t.kind==='group'?t.id:t.parent;const error=validateMove(id,dest);openModal('move-review',{id,parent:dest,before:t.kind==='doc'?t.id:null,error});render()})});el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();selectNode(el.dataset.node)}})})}
function destinationForNew(){const n=node(selected);if(n?.kind==='doc')return n.parent;if(n?.kind==='group')return n.id;return data.nodes.find(n=>n.kind==='group')?.id||null}
function ancestorModel(id){let n=node(id);while(n){if(n.model)return n.model;n=node(n.parent)}return data.models.length===1&&data.settings.autoModel?data.models[0].id:null}
function createDocument(){navigate(()=>{const parent=destinationForNew();if(!parent){openModal('new-group');return}if(depthOf(parent)>=3){openModal('depth-error');return}const id='doc-'+Date.now(),m=ancestorModel(parent),c=makeContent(id,'Untitled document','<h2>Start writing your guide</h2><p>Add the steps your readers need to complete their task.</p>',m?[m]:[], 'User guide',false);c.summary='';c.access=data.settings.access;data.contents.push(c);const n={id:'n-'+id,kind:'doc',content:id,parent};data.nodes.push(n);selected=n.id;collapsed.delete(parent);treeQuery='';category='All categories';loadEdit();persist();render();$('#doc-title').focus();$('#doc-title').select();toast('Draft created in this group. No duplicate content was created.')})}
function saveDraft(){if(!edit||role!=='admin')return false;Object.assign(current(),clone(edit));dirty=false;saveState='Draft saved just now';persist();render();return true}
function publishedCheck(){if(!edit?.title.trim()||edit.title==='Untitled document')return 'Add a clear document title before publishing.';if(!edit.models.length)return 'Choose the product or model this document applies to.';if(!node(selected)?.parent)return 'Choose a directory group before publishing.';return ''}
function applyMove(d){const n=node(d.id);const err=validateMove(d.id,d.parent);if(err){toast(err);return}data.nodes=data.nodes.filter(x=>x.id!==d.id);n.parent=d.parent;if(d.before){const i=data.nodes.findIndex(x=>x.id===d.before);data.nodes.splice(i<0?data.nodes.length:i,0,n)}else data.nodes.push(n);collapsed.delete(d.parent);persist();closeModal();render();toast('Directory updated. The original content and shared link stay the same.')}
function reorder(direction){navigate(()=>{const n=node(selected),siblings=children(n.parent),i=siblings.findIndex(x=>x.id===n.id),target=siblings[i+direction];if(!target){toast(direction<0?'Already first in this group.':'Already last in this group.');return}openModal('move-review',{id:n.id,parent:n.parent,before:direction<0?target.id:siblings[i+2]?.id||null,reorder:true,error:''})})}
function openModal(type,extra={}){lastFocus=document.activeElement;modal={type,...extra};menu=false;renderModal();requestAnimationFrame(()=>$('#modal-root .modal')?.focus())}
function closeModal(){modal=null;$('#modal-root').innerHTML='';lastFocus?.isConnected&&lastFocus.focus()}
function modalFrame(title,subtitle,body,foot='',wide=''){return `<div class="overlay"><section class="modal ${wide}" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"><div class="modal-head"><div><h2 id="modal-title">${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${btn(icon('close'),'close','iconbtn','aria-label="Close dialog"')}</div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</section></div>`}
const cancel=()=>btn('Cancel','close');

 if(m.type==='confirm-mode')html=modalFrame('Load another demo setup?','Your current sample changes will be reset.',`<p>The <strong>${m.mode==='single'?'single-product':'multi-product'}</strong> setup uses a fresh directory and sample content. This does not affect any real Gradual data.</p>`,cancel()+btn('Load demo setup','confirm-mode','primary'));
 if(m.type==='unsaved'||m.type==='settings-unsaved')html=modalFrame('You have unsaved changes','Save your changes before leaving this page.',`<div class="notice amber">${icon('info')}Your changes have not been saved. You can keep editing, discard them, or save and continue.</div>`,btn('Stay','close')+btn('Discard changes','discard')+btn('Save and continue','save-continue','primary'));

function frontArticle(){const original=content(frontState.id);if(!canRead(original))return emptyFront(readerIdentity==='guest'?'Sign in to continue':'This page is unavailable',readerIdentity==='guest'?'This documentation requires membership. Continue with the demo member view to return to this page.':'The document may be unpublished, removed, or outside your current access. Choose another guide or switch the demo reader role.',readerIdentity==='guest'?'front-login':'front-home');const c=original.published,n=linked(original.id);if(!scoped(c)){frontNotice='This article does not apply to the selected model. No equivalent guide is linked. Choose a document below.';return frontGroupLanding(readerDocs())}const docs=readerDocs(),index=docs.findIndex(x=>x.original.id===original.id),prev=docs[index-1],next=docs[index+1];const headings=[...c.body.matchAll(/<h2[^>]*>(.*?)<\/h2>/g)].map((h,i)=>({id:'section-'+i,text:plain(h[1])}));let hi=0;let body=c.body.replace(/<h2[^>]*>/g,()=>`<h2 id="section-${hi++}">`);const related=docs.filter(x=>x.original.id!==original.id&&x.c.models.some(id=>c.models.includes(id))).slice(0,2);return `<div class="reading-top"><div class="reading-crumb">${btn('Documentation','front-home','link')}<span>/</span><span>${esc(parentPath(n.parent))}</span></div>${btn(icon('list')+'Document directory','front-menu','front-mobile-menu')}</div><div class="full-reader"><aside class="front-directory ${frontMenu?'open':''}"><div class="directory-caption">${icon('book')}DOCUMENTATION</div>${searchForm('',true)}${frontTree(docs)}</aside><article class="front-article"><div class="article-eyebrow"><span class="badge green">${esc(modelsText(c))}</span><span>${esc(c.type)}</span></div><h1>${esc(c.title)}</h1><p class="article-summary">${esc(c.summary)}</p><div class="article-byline"><span>Updated ${esc(c.updated||'Nov 12, 2026')}</span><span>·</span><span>${Math.max(1,Math.ceil(plain(c.body).split(/\s+/).length/170))} min read</span>${btn(icon('link')+'Share','front-share function renderCommunity(){document.title=(frontState.id&&canRead(content(frontState.id))?content(frontState.id).published.title:frontState.query?'Search documentation':data.settings.name)+' · Gradual';$('#app').innerHTML=communityHeader()+`<main class="community-main">${frontTools()}${frontState.id?frontArticle():frontState.query?frontResults():frontHome()}</main><footer class="community-footer"><div class="community-brand small">${icon('feather')}<span>Gradual</span></div><span>Product documentation · Interactive concept</span><div>${btn('About this demo','front-about','link')}${btn('Admin workspace '+icon('arrow'),'front-surface:admin','link')}</div></footer>`;
 $('#front-search-form')?.addEventListener('submit',e=>{e.preventDefault();const q=$('#front-search-input').value.trim();frontNavigate(null,frontState.model,q)});
 $('#front-model-select')?.addEventListener('change',e=>{const m=e.target.value,c=content(frontState.id)?.published;frontNotice='';if(c&&!(m==='all'||c.models.includes(m)||c.models.includes('general'))){frontNotice='This article does not apply to '+modelName(m)+'. Choose a guide from this model’s directory.';frontNavigate(null,m)}else frontNavigate(frontState.id,m,frontState.query,frontState.type)});

}

async function copyText(text){try{await navigator.clipboard.writeText(text);toast('Copied to clipboard.')}catch{openModal('copy-link',{link:text})}}
function shareDemo(article=false){if(article&&(!seedIds.has(frontState.id)||frontState.id==='setup')){openModal('local-document-share');return}const base=location.protocol==='file:'?'https://starry063.github.io/gradual-document-center/':location.origin+location.pathname;const url=base+(article?navUrl(frontState.id,frontState.model,'','All types',frontState.section):'#/docs');openModal('share-demo',{link:url,article})}
const originalRenderModal=renderModal;
renderModal=function(){if(!modal)return;let html='';if(modal.type==='share-demo'||modal.type==='copy-link')html=modalFrame(modal.article?'Share this guide':'Share the prototype','Anyone with the published link can explore the demo.',`<div class="field"><label for="share-url">${modal.article?'Document link':'Prototype link'}</label><input id="share-url" value="${esc(modal.link)}" readonly></div><div class="notice">${icon('info')}<span>Everyone gets their own browser-local demo data. Your edits, drafts and new documents are not shared with other visitors.</span></div>`,btn('Close','close')+btn(icon('link')+'Copy link','front-copy','primary'));else if(modal.type==='local-document-share')html=modalFrame('This document is local to your browser','New demo documents are not uploaded to a shared database.',`<p>You can share the complete prototype. Other visitors will start with the sample documentation and can make their own changes.</p>`,btn('Close','close')+btn('Share prototype','front-share-demo','primary'));else if(modal.type==='front-about')html=modalFrame('One prototype, two perspectives','Explore the connected community and admin experiences.',`<div class="stack"><div><h3>Community</h3><p class="hint">Browse products, search documentation, read consecutive guides, and share a page. Switch the preview reader to explore access states.</p></div><div><h3>Admin workspace</h3><p class="hint">Create or reuse an article, organize the one directory, save drafts and publish updates. Switch back to Community to see your published changes.</p></div><div><h3>Your own demonstration</h3><p class="hint">Edits are saved in this browser. They do not affect other visitors or a real Gradual community. Role checks demonstrate the proposed behavior, not a production security boundary.</p></div></div>`,btn('Explore the admin workspace','front-surface:admin')+btn('Continue browsing','close','primary'));else if(modal.type==='front-support')html=modalFrame('Ask your community','A demonstration of the support handoff.',`<p>In the finished product, this would open the organization’s community or support channel with the current model and guide attached.</p><div class="notice green">${icon('info')}No message is sent from this prototype.</div>`,btn('Back to documentation','close','primary'));else return originalRenderModal();$('#modal-root').innerHTML=html};
handle=function(a){const [cmd,arg]=a.split(':');if(cmd==='front-surface'){switchSurface(arg);return}if(cmd==='front-home'){frontNotice='';frontCategory='All categories';frontNavigate();return}if(cmd==='front-read'){frontNotice='';frontNavigate(arg,frontState.model);return}if(cmd==='front-model'){frontNotice='';frontNavigate(null,arg);return}if(cmd==='front-category'){frontCategory=arg;render();return}if(cmd==='front-menu'){frontMenu=!frontMenu;render();return}if(cmd==='front-login'){readerIdentity='member';render();return}if(cmd==='front-search-all'){frontNavigate(null,'all',frontState.query);return}if(cmd==='front-clear-search'){frontNavigate(null,'all',frontState.query,'All types');return}if(cmd==='front-back-guide'){frontNavigate(null,frontState.model);return}if(cmd==='front-feedback'){feedback[frontState.id]=arg;render();return}if(cmd==='front-share-demo'||cmd==='front-share-article'){shareDemo(cmd==='front-share-article');return}if(cmd==='front-copy'){copyText(modal.link);return}if(cmd==='front-about'||cmd==='front-support'){openModal(cmd);return}if(cmd==='community'){switchSurface('community');return}if(cmd==='view-published'){const id=current()?.id;closeModal();frontNavigate(id,edit?.models.length===1?edit.models[0]:'all');return}if(cmd==='confirm-mode'){adminHandle(a);data.frontendDemoReady=true;persist();$('#prototype-bar').innerHTML=prototypeBar();return}adminHandle(a)};
window.addEventListener('hashchange',readRoute);
readRoute();
</script><script>/* The supplied November 12 Word mockups are the visual reference.
   Photo regions use the original supplied bitmap through CSS clipping.
   All navigation, text, forms and interaction remain live HTML. */
const priorSeed=seed;
function mockupSeed(d){
 const add=(id,title,models,parent,type='User guide',source='Resources',body=null)=>{
  if(d.contents.some(c=>c.id===id))return;
  const c=makeContent(id,title,body||`<h2>Before you begin</h2><p>Have your device and the companion app ready. This is sample documentation for the interactive prototype.</p><h2>Follow the setup prompts</h2><p>Open the app and follow the instructions for ${models.map(m=>m==='general'?'your product':'Model '+m.toUpperCase()).join(' and ')}.</p><h2>Confirm the connection</h2><p>Check the connection status before continuing.</p>`,models,type,true,source);c.summary=id==='connect-a'?'Pair your device with the companion app and confirm the connection.':`A practical guide to ${title.toLowerCase()}.`;c.published=clone({...c,published:undefined});d.contents.push(c);d.nodes.push({id:'node-'+id,kind:'doc',content:id,parent});
 };
 if(d.mode==='multi'){
  if(!d.models.some(m=>m.id==='c'))d.models.push({id:'c',name:'Model C',category:'Drones'});
  [['au','User guide','ma'],['mc','Model C',null],['cg','Getting started','mc']].forEach(([id,name,parent])=>{if(!d.nodes.some(n=>n.id===id))d.nodes.push({id,kind:'group',name,parent,...id==='mc'?{model:'c'}:{}})});
  add('connect-a','Connect your device',['a'],'ag','Getting started');
  add('controls','Controls and settings',['a'],'au');add('care','Care and maintenance',['a'],'au');add('updates','Update problems',['a'],'at','Troubleshooting');
  add('power-c','First power-on',['c'],'cg','Getting started');
  add('warranty','Warranty & support',['general'],'general','Account');
  // Shared documentation has one directory position and multiple applicable models.
  for(const id of ['walkthrough','checklist'])if(!d.nodes.some(n=>n.content===id))d.nodes.push({id:'node-'+id,kind:'doc',content:id,parent:'general'});
 }else{
  d.models=[{id:'a',name:'Model A',category:'Drones'}];
  const p=d.contents.find(c=>c.id==='power');if(p){Object.assign(p,{title:'First power-on',body:sampleBody,summary:'Get Model A ready for its first use.'});p.published=clone({...p,published:undefined})}
  const f=d.nodes.find(n=>n.id==='features');if(f)f.name='User guide';
  for(const [id,title] of [['feature-a','Controls and settings'],['feature-b','Care and maintenance'],['sign-in','Connection issues'],['account','Account management']]){const c=d.contents.find(c=>c.id===id);if(c){c.title=title;c.published.title=title}}
  add('connect-a','Connect your device',['a'],'ag','Getting started');add('updates','Update problems',['a'],'general','FAQ');
 }
 if(d.mode==='multi'){const i=d.nodes.findIndex(n=>n.id==='au'),a=d.nodes.findIndex(n=>n.id==='at');if(i>a&&a>=0){const g=d.nodes.splice(i,1)[0];d.nodes.splice(a,0,g)}}
 d.mockupRevision=2;return d;
}
seed=mode=>mockupSeed(priorSeed(mode));
if((data.mockupRevision||0)<2){mockupSeed(data);persist();loadEdit()}
['connect-a','controls','care','updates','power-c','warranty'].forEach(id=>seedIds.add(id));
let productClass='All models';
paths.power='M12 2v10 M6 5a9 9 0 1 0 12 0';
paths.sliders='M3 6h18 M3 12h18 M3 18h18 M8 3v6 M16 9v6 M8 15v6';
const photo=(m='a',cls='')=>`<div class="mock-photo photo-${['a','b','c'].includes(m)?m:'a'} ${cls}" role="img" aria-label="${esc(modelName(m))} drone in flight"></div>`;
const groupIcon=name=>/start/i.test(name)?'power':/trouble|FAQ/i.test(name)?'help':/general|account/i.test(name)?'users':'sliders';
const modelHasDocs=m=>readerDocs(false).some(x=>x.c.models.includes(m.id));
communityHeader=function(){return `<header class="community-header"><div class="community-brand"><div class="brandmark">${icon('feather')}</div><strong>Gradual’s Test</strong></div><nav aria-label="Community navigation"><button disabled>Home</button><button disabled>Events</button><button disabled>Content</button>${btn('Document Center','front-home','active')}<button disabled>Discussions</button></nav><div class="community-user">${icon('search')}${icon('bell')}<span class="avatar">${icon('users')}</span></div></header>`};
searchForm=function(value='',small=false){return `<form class="front-search ${small?'small':''}" id="front-search-form">${icon('search')}<input id="front-search-input" aria-label="Search documentation" placeholder="${frontState.model==='all'?'Search all documentation':'Search '+esc(modelName(frontState.model))+' documentation'}" value="${esc(value)}" autocomplete="off"><button type="submit" aria-label="Search">${icon('arrow')}</button></form>`};
frontTools=function(){return `<div class="front-tools"><div class="reading-crumb">${btn('Document Center','front-home','link')}${frontState.model!=='all'?`<span>/</span><strong>${esc(modelName(frontState.model))}</strong>`:''}${frontState.query?'<span>/</span><strong>Search</strong>':''}</div><div class="flex">${data.mode==='multi'?`<select id="front-model-select" aria-label="Current product"><option value="all">All documentation</option>${data.models.filter(modelHasDocs).map(m=>`<option value="${m.id}" ${frontState.model===m.id?'selected':''}>Viewing: ${esc(m.name)}</option>`).join('')}</select>`:''}<select id="reader-identity" aria-label="Preview as reader">${[['guest','Guest'],['member','Member'],['specialist','Product A member']].map(([id,t])=>`<option value="${id}" ${readerIdentity===id?'selected':''}>${t}</option>`).join('')}</select><select id="front-demo-scenario" aria-label="Documentation scenario"><option value="multi" ${data.mode==='multi'?'selected':''}>Multiple products</option><option value="single" ${data.mode==='single'?'selected':''}>Single product</option></select></div></div>`};
frontHome=function(){const docs=readerDocs(),all=readerDocs(false),single=data.mode==='single',scoped=frontState.model!=='all',m=scoped?frontState.model:'a';
 if(!all.length)return emptyFront('Sign in to view documentation','Choose a member view to explore the sample documentation.','front-login');
 const products=data.models.filter(modelHasDocs).filter(x=>productClass==='All models'||(productClass==='Professional'?x.id==='c':['a','b'].includes(x.id)));
 return `<section class="docs-hero ${single||scoped?'model-hero':''}">${photo(m,'hero-photo')}<div class="hero-shade"></div><div class="hero-copy"><h1>${single?'Get started with Model A':scoped?esc(modelName(m)):'Find your drone.<br>Find your answer.'}</h1><p>${scoped?'Your guide from first setup to everyday use.':'Official guides, helpful answers, and a clear next step.'}</p>${searchForm()}</div></section>${frontNotice?`<div class="notice amber">${icon('info')}${esc(frontNotice)}</div>`:''}${single||scoped?frontGroupLanding(docs):`<section class="products-section"><div class="section-heading"><h2>Choose your model</h2></div><div class="category-tabs">${['All models','Compact','Professional'].map(c=>btn(c,'mock-category:'+c,c===productClass?'active':'')).join('')}</div><div class="product-grid">${products.map(x=>`<button class="product-card" data-action="front-model:${x.id}">${photo(x.id)}<div class="product-info"><span>Drone</span><h3>${esc(x.name)}</h3><span class="view-docs">View documentation ${icon('arrow')}</span></div></button>`).join('')||'<p>No published models in this category.</p>'}</div></section><section class="common-guides"><h2>Common guides</h2><div class="common-grid">${all.filter(x=>['account','warranty'].includes(x.original.id)).map(x=>btn(icon(x.original.id==='account'?'users':'help')+'<strong>'+esc(x.c.title)+'</strong>'+icon('arrow'),'front-read:'+x.original.id)).join('')}</div></section>`}`;
};
frontGroupLanding=function(docs){const general=docs.filter(x=>node(x.n.parent)?.name==='General guides'),main=docs.filter(x=>!general.includes(x));const groups=[...new Set(main.map(x=>x.n.parent))];return `<section class="group-landing"><div class="front-group-grid">${groups.map(id=>`<section class="front-group-card"><h3>${icon(groupIcon(node(id)?.name))}${esc(node(id)?.name||'Documentation')}</h3>${main.filter(x=>x.n.parent===id).map(x=>btn(`<span>${esc(x.c.title)}</span>${icon('right')}`,'front-read:'+x.original.id)).join('')}</section>`).join('')}</div></section>${general.length?`<section class="general-panel"><h2>General guides</h2><div class="general-grid">${general.map(x=>btn(`${icon(x.original.source==='Video'?'video':x.original.source==='File'?'download':'users')}<span><strong>${esc(x.c.title)}</strong><small>${x.original.source==='Video'?'Video · Demo':x.original.source==='File'?'PDF · Sample file':esc(modelsText(x.c))}</small></span>${icon('arrow')}`,'front-read:'+x.original.id)).join('')}</div></section>`:''}`};
const priorArticle=frontArticle;
frontArticle=function(){let h=priorArticle();if(!canRead(content(frontState.id)))return h;
 h=h.replace(searchForm('',true),'').replace('<div class="full-reader">','<div class="reading-search">'+searchForm('',true)+'</div><div class="full-reader">');
 if(['power','connect-a'].includes(frontState.id))h=h.replace('<div class="article-content">','<div class="article-content"><div class="reader-photo" role="img" aria-label="Model A paired with the companion app"></div>');
 if(['connect','power-c'].includes(frontState.id))h=h.replace('<div class="article-content">','<div class="article-content">'+photo(frontState.id==='connect'?'b':'c'));
 return h;
};

const priorCommunityRender=renderCommunity;
renderCommunity=function(){priorCommunityRender();$('#front-demo-scenario')?.addEventListener('change',e=>{if(e.target.value===data.mode)return;openModal('mock-scenario',{mode:e.target.value})})};
